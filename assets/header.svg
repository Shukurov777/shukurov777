<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <pattern id="g" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect width="900" height="240" rx="18"/></clipPath>
    <style>
      .grid{animation:pan 12s linear infinite}
      @keyframes pan{to{transform:translate(30px,30px)}}
      .orb{animation:float 9s ease-in-out infinite}
      @keyframes float{50%{transform:translate(120px,-20px)}}
      .name{font:700 52px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fff;letter-spacing:2px;
            opacity:0;animation:in 1.2s .2s ease-out forwards}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      .sub{font:500 18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a3a3a3}
      .type{clip-path:inset(0 100% 0 0);animation:type 3.2s 1.2s steps(46) forwards}
      @keyframes type{to{clip-path:inset(0 0 0 0)}}
      .cur{fill:#fff;animation:blink 1s step-end infinite}
      @keyframes blink{50%{opacity:0}}
      .scan{animation:sweep 5s 1s ease-in-out infinite}
      @keyframes sweep{0%{transform:translateX(-300px)}60%,100%{transform:translateX(1000px)}}
      .dot{fill:#22c55e;animation:pulse 2s ease-in-out infinite;transform-origin:62px 196px}
      @keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
      .tag{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#737373;letter-spacing:1px}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="900" height="240" fill="#000"/>
    <rect class="grid" x="-30" y="-30" width="960" height="300" fill="url(#g)"/>
    <circle class="orb" cx="640" cy="90" r="220" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="160" height="240" fill="url(#scan)" opacity=".12"/>
    <text class="name" x="56" y="104">Bahrullo Shukurov</text>
    <g class="type">
      <text class="sub" x="58" y="146">AI agents · Telegram bots · Python · PHP · Vue</text>
    </g>
    <rect class="cur" x="584" y="131" width="10" height="20"/>
    <circle class="dot" cx="62" cy="196" r="5"/>
    <text class="tag" x="78" y="201">BUILDING IN PUBLIC</text>
    <rect x=".5" y=".5" width="899" height="239" rx="18" fill="none" stroke="#fff" stroke-opacity=".12"/>
  </g>
</svg>
